<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drückjagd-Tagebuch</title>
<meta name="description" content="Jagdtagebuch für Drückjagden: Uhr bis Hahn in Ruh, Schusszähler, Sichtungen mit Anschussmeldung und PDF-Bericht.">
<meta name="theme-color" content="#0a0e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drückjagd">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<style>
/* Layout: eine Spalte für das Handy am Stand. Oben Uhr bis „Hahn in Ruh“ und Schusszähler, darunter die Sichtungen, unten feste Aktionsleiste. Erfassung als Vollbild-Blatt nach dem Muster der Anschussmeldung. */
:root{
  --ground:#0a0e0b;
  --panel:#121b15;
  --panel-2:#1a271e;
  --forest:#21422c;
  --line:rgba(244,239,228,.2);
  --line-strong:rgba(244,239,228,.45);
  --fg:#f6f1e6;
  --muted:#c4bdad;
  --signal:#f08a24;
  --signal-ink:#140b02;
  --signal-soft:rgba(240,138,36,.16);
  --good:#8fd286;
  --warn:#f2c94c;
  --bad:#ff6b52;
  --hit:#ff4b36;
  --track:rgba(0,0,0,.35);
  --photo-bg:#000000;
  --photo-fg:#ffffff;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html.sun{
  --ground:#ffffff;
  --panel:#eef3ed;
  --panel-2:#e0e9dd;
  --forest:#cfe1d2;
  --line:rgba(8,20,10,.3);
  --line-strong:rgba(8,20,10,.65);
  --fg:#040704;
  --muted:#27322a;
  --signal:#e06a00;
  --signal-ink:#000000;
  --signal-soft:rgba(224,106,0,.14);
  --good:#146b26;
  --warn:#6e4f00;
  --bad:#b3261e;
  --hit:#d0180a;
  --track:rgba(8,20,10,.15);
  color-scheme:light;
}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100vh;overscroll-behavior-y:none;background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ground);z-index:35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 150px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin:0}
.label{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:15px}
.hint{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.note{margin:0;padding:10px 12px;border:2px dashed var(--signal);border-radius:6px;font-size:15px}
h1,h2,h3,h4{text-wrap:balance}

/* Buttons */
.btn{min-height:52px;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;
  padding:0 18px;border:2px solid var(--line-strong);background:transparent;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;text-align:center;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.small{min-height:44px;font-size:17px;padding:0 14px}
.btn.icon{width:48px;min-width:48px;padding:0}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--ground)}
.btn:active{transform:translateY(1px)}
.grow{flex:2 1 0;min-width:0}
.grow2{flex:1 1 0;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Übersicht */
.brand{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,16vw,86px);line-height:.84;margin:0;text-transform:uppercase;letter-spacing:.01em}
.brand p.lead{margin:6px 0 0;color:var(--muted);max-width:48ch}
.hlist{display:flex;flex-direction:column;gap:10px}
.hcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--forest);border-radius:6px;padding:14px;cursor:pointer;color:var(--fg)}
.hcard:hover{border-color:var(--line-strong);border-left-color:var(--signal)}
.hcard .hc-name{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.hcard .hc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px;color:var(--muted)}
.hcard .hc-meta b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:22px;border:2px dashed var(--line-strong);border-radius:8px;color:var(--muted);text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.srow{display:flex;align-items:center;gap:12px;min-height:48px}
.srow + .srow{border-top:1px solid var(--line);padding-top:12px}
.srow .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .lbl b{font-weight:700;font-size:17px}
.srow .lbl small{color:var(--muted);font-size:14.5px;line-height:1.35}
.sw{position:relative;flex:none;width:56px;height:34px;display:block}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw .tr{position:absolute;inset:0;border-radius:17px;background:var(--line-strong);transition:background .2s ease}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--ground);transition:transform .2s ease}
.sw input:checked + .tr{background:var(--signal)}
.sw input:checked + .tr::after{transform:translateX(22px)}
.sw input:focus-visible + .tr{outline:3px solid var(--signal);outline-offset:2px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* Jagd-Ansicht */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .tb-title{flex:1;min-width:0}
.topbar h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,42px);line-height:.92;margin:2px 0 0;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0}
.meta div{border-top:2px solid var(--line);padding-top:5px;min-width:0}
.meta dt{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:1px 0 0;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.timer{background:var(--forest);border-color:transparent}
.clock{font-family:var(--f-display);font-weight:800;font-size:clamp(70px,22vw,118px);line-height:.86;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock.warn{color:var(--warn)}
.clock.over{color:var(--signal);font-size:clamp(46px,14vw,74px)}
.clock.pre{opacity:.85}
.pbar{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:var(--signal)}
.count-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:stretch}
.count-input{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,22vw,104px);line-height:1;width:100%;min-width:0;box-sizing:border-box;background:var(--panel-2);border:2px solid var(--line-strong);border-radius:8px;color:var(--fg);padding:0 14px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.count-input::-webkit-outer-spin-button,.count-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.plus{width:clamp(116px,34vw,150px);min-height:clamp(116px,34vw,150px);font-size:56px;font-weight:800;border-radius:8px}
.bump{animation:bump .35s ease}
@keyframes bump{0%{background:var(--signal-soft)}100%{background:var(--panel-2)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{border-top:3px solid var(--signal);padding-top:6px;min-width:0}
.stats div:not(:first-child){border-top-color:var(--forest)}
html.sun .stats div:not(:first-child){border-top-color:var(--fg)}
.stats b{display:block;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h3{font-family:var(--f-display);font-weight:800;font-size:32px;margin:0;text-transform:uppercase;line-height:1}
.elist{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--forest);border-radius:6px;padding:12px;color:var(--fg);cursor:pointer}
html.sun .entry{border-left-color:var(--fg)}
.entry.shot,html.sun .entry.shot{border-left-color:var(--signal)}
.e-time{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.e-main{min-width:0}
.e-main b{display:block;font-weight:700;font-size:17px;line-height:1.25}
.e-main small{display:block;color:var(--muted);font-size:15px;line-height:1.3;margin-top:3px}
.e-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.e-thumb{width:58px;height:58px;object-fit:cover;border-radius:4px;background:var(--panel-2);display:block}
.tag{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--signal);color:var(--signal-ink);white-space:nowrap}
.tag.good{background:transparent;color:var(--good);border:2px solid var(--good)}
.tag.warn{background:transparent;color:var(--warn);border:2px solid var(--warn)}
.tag.ex{background:transparent;color:var(--signal);border:2px solid var(--signal)}

/* Aktionsleiste */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ground);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.bar-in .btn{min-height:58px;font-size:22px;white-space:nowrap}

/* Blätter */
.sheet{position:fixed;inset:0;z-index:40;background:var(--ground);display:flex;flex-direction:column}
.sheet-head{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.sheet-head .in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sheet-head h3{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:.95;margin:2px 0 0;text-transform:uppercase}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.sheet-body .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.sheet-foot{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-foot .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.sheet-foot .btn{min-height:58px;font-size:23px}

/* Formular */
.blk{display:flex;flex-direction:column;gap:10px}
.blk h4{font-family:var(--f-display);font-weight:800;font-size:25px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1}
.blk h5{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.inp{font:inherit;font-size:17px;color:var(--fg);background:var(--panel-2);border:2px solid var(--line);border-radius:6px;min-height:50px;padding:0 12px;width:100%;box-sizing:border-box;min-width:0;display:block}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--signal);outline:none}
.field textarea{padding:10px 12px;min-height:96px;resize:vertical;line-height:1.4}
.field input[type=time],.field input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;line-height:46px}
.sel{position:relative}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:9px;height:9px;border-right:3px solid var(--fg);border-bottom:3px solid var(--fg);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{-webkit-appearance:none;appearance:none;padding-right:38px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 15px;border-radius:999px;border:2px solid var(--line-strong);background:transparent;color:var(--fg);font-family:var(--f-body);font-weight:700;font-size:16px;cursor:pointer;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg .chip{min-height:64px;border-radius:8px;font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.04em}
.animal{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.animal .a-top{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;color:var(--bad);font-weight:700;font-size:15px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.stepper{display:flex;align-items:stretch;border:2px solid var(--line-strong);border-radius:6px;overflow:hidden;min-height:50px}
.stepper button{width:50px;flex:none;background:var(--panel-2);border:0;color:var(--fg);font-size:28px;font-weight:700;cursor:pointer;touch-action:manipulation}
.stepper output{flex:1;min-width:40px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.shotwrap{border-left:5px solid var(--signal);padding-left:14px;display:flex;flex-direction:column;gap:26px}
.canvas-box{background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:8px}
.canvas-box canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none}
#skCv{aspect-ratio:1;max-width:440px;margin:0 auto}
#poseCv{aspect-ratio:200/120}
.readout{margin:0;font-weight:700;font-size:16px;min-height:1.4em}
.photo-prev{border-radius:8px;overflow:hidden;background:var(--photo-bg);border:2px solid var(--line)}
.photo-prev img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain}

/* Zeichnen auf dem Foto */
.draw{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--photo-bg);color:var(--photo-fg);
  --fg:#f6f1e6;--line-strong:rgba(255,255,255,.5);--line:rgba(255,255,255,.25);--panel:#141414;--signal-ink:#140b02;--signal:#f08a24}
.draw-top,.draw-tools{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);color:var(--fg)}
.draw-tools{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap;justify-content:center}
.draw-top h3{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;text-transform:uppercase;line-height:1}
.draw-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#drawCv{touch-action:none;display:block}
.pen{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.35);cursor:pointer}
.pen[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--ground);padding:12px 18px;border-radius:6px;font-weight:700;font-size:16px;max-width:min(560px,calc(100% - 32px));box-sizing:border-box;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.install{border:2px solid var(--signal);background:var(--signal-soft)}
.install ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.repstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.repstat div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.repstat b{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.repstat span{font-size:14px;color:var(--muted)}
.replist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){ .meta{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion: reduce){ .sw .tr,.sw .tr::after{transition:none} .bump{animation:none} }
</style>
</head>
<body>

<main class="wrap" id="view" lang="de"></main>
<div id="bar"><div class="bar-in" id="barIn"></div></div>

<!-- Drückjagd anlegen / bearbeiten -->
<div id="hs" class="sheet" lang="de" hidden role="dialog" aria-modal="true" aria-labelledby="hsTitle">
  <div class="sheet-head"><div class="in"><div><p class="eyebrow" id="hsEye">Neue Drückjagd</p><h3 id="hsTitle">Jagddaten</h3></div><button class="btn small" type="button" data-act="hsCancel">Abbrechen</button></div></div>
  <div class="sheet-body"><div class="in" id="hsBody"></div></div>
  <div class="sheet-foot"><div class="in"><button class="btn primary grow" type="button" data-act="hsSave" id="hsSave">Drückjagd anlegen</button></div></div>
</div>

<!-- Sichtung erfassen -->
<div id="ed" class="sheet" lang="de" hidden role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="sheet-head"><div class="in"><div><p class="eyebrow" id="edEye">Neue Sichtung</p><h3 id="edTitle">Sichtung</h3></div><button class="btn small" type="button" data-act="edCancel" id="edCancel">Abbrechen</button></div></div>
  <div class="sheet-body" id="edScroll"><div class="in" id="edBody"></div></div>
  <div class="sheet-foot"><div class="in"><button class="btn primary grow" type="button" data-act="edSave" id="edSave">Eintrag hinzufügen</button></div></div>
</div>

<!-- Bericht -->
<div id="rep" class="sheet" lang="de" hidden role="dialog" aria-modal="true" aria-labelledby="repTitle">
  <div class="sheet-head"><div class="in"><div><p class="eyebrow">Abschluss</p><h3 id="repTitle">Bericht</h3></div><button class="btn small" type="button" data-act="repClose">Schließen</button></div></div>
  <div class="sheet-body"><div class="in" id="repBody"></div></div>
  <div class="sheet-foot"><div class="in"><button class="btn primary grow" type="button" data-act="repMake" id="repMake">PDF erstellen</button></div></div>
</div>

<!-- Weg auf dem Foto einzeichnen -->
<div id="draw" class="draw" hidden role="dialog" aria-modal="true" aria-labelledby="drawTitle">
  <div class="draw-top"><div><p class="eyebrow">Foto</p><h3 id="drawTitle">Weg einzeichnen</h3></div><button class="btn primary small" type="button" data-act="drawDone">Fertig</button></div>
  <div class="draw-stage" id="drawStage"><canvas id="drawCv" aria-label="Foto, mit dem Finger den Weg des Stücks einzeichnen"></canvas></div>
  <div class="draw-tools">
    <button type="button" class="pen" data-pen="o" aria-pressed="true" aria-label="Stift orange" style="background:#f08a24"></button>
    <button type="button" class="pen" data-pen="r" aria-pressed="false" aria-label="Stift rot" style="background:#ff3b30"></button>
    <button type="button" class="pen" data-pen="w" aria-pressed="false" aria-label="Stift weiß" style="background:#ffffff"></button>
    <button type="button" class="btn small" data-act="drawUndo">Rückgängig</button>
    <button type="button" class="btn small" data-act="drawClear">Alles weg</button>
  </div>
</div>

/* ---------- Speicher (IndexedDB, Ersatz: localStorage, sonst nur im Arbeitsspeicher) ---------- */
const KV={idb:null,mem:new Map(),
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('drueckjagd-tagebuch',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.idb=r.result;res()}; r.onerror=()=>res(); r.onblocked=()=>res() }catch(e){res()} }) },
  fget(k){ try{ const v=localStorage.getItem('dj:'+k); if(v!=null) return JSON.parse(v) }catch(e){} return this.mem.get(k) },
  fset(k,v){ this.mem.set(k,v); try{ localStorage.setItem('dj:'+k,JSON.stringify(v)) }catch(e){} },
  fdel(k){ this.mem.delete(k); try{ localStorage.removeItem('dj:'+k) }catch(e){} },
  get(k){ if(!this.idb) return Promise.resolve(this.fget(k)); return new Promise(res=>{ try{ const q=this.idb.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(this.fget(k)) }catch(e){ res(this.fget(k)) } }) },
  set(k,v){ if(!this.idb){ this.fset(k,v); return Promise.resolve() } return new Promise(res=>{ try{ const tx=this.idb.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>{ this.fset(k,v); res() } }catch(e){ this.fset(k,v); res() } }) },
  del(k){ if(!this.idb){ this.fdel(k); return Promise.resolve() } return new Promise(res=>{ try{ const tx=this.idb.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res() }catch(e){ res() } }) }
};

const IS_STANDALONE=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
async function deliverFile(blob,filename,title){
  const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title}); return 'shared' }
    catch(e){ if(e&&e.name==='AbortError') return 'aborted' }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); return 'downloaded';
}

/* ---------- Ableitungen ---------- */
function ownShots(h){ return h.entries.reduce((a,e)=>a+(e.shot&&e.s?(((+e.s.gleich||0)+(+e.s.rotte||0))||1):0),0) }
function animalText(a){ const name=a.art==='Sonstiges'?(a.name||'Sonstiges'):a.art; const kl=a.klasse&&a.klasse!=='unbestimmt'?' · '+a.klasse:''; return (a.n>1?a.n+'× ':'')+name+kl+(a.kg?' · ca. '+a.kg+' kg':'') }
function animalsText(e){ return (e.animals||[]).map(animalText).join(', ') }
function polar(p){ const r=Math.hypot(p[0],p[1])/10; let a=Math.atan2(p[0],-p[1])*180/Math.PI; if(a<0) a+=360; return {m:Math.round(r/5)*5,dir:DIRS[Math.round(a/45)%8]} }
function sketchText(e){
  const sk=e.sketch; if(!sk) return ''; const parts=[];
  sk.x.forEach((p,i)=>{ const q=polar(p); parts.push(`Anschuss${sk.x.length>1?' '+(i+1):''} ca. ${q.m} m ${q.dir}`) });
  const ps=sk.paths.filter(p=>p.length>1);
  if(ps.length){ const a=polar(ps[0][0]), b=polar(ps[0][ps[0].length-1]); parts.push(`Weg von ${a.dir} (${a.m} m) nach ${b.dir} (${b.m} m)`+(ps.length>1?`, ${ps.length-1} weitere`:'')) }
  return parts.join(' · ');
}
function silKind(d){ const a=(d.animals||[])[0]; return (WILD[a&&a.art]||WILD.Schwarzwild).sil }
function aggregate(h){
  const m=new Map();
  for(const e of h.entries) for(const a of e.animals||[]){
    const key=a.art==='Sonstiges'?(a.name||'Sonstiges'):a.art; if(!m.has(key)) m.set(key,{art:key,n:0,kl:new Map()});
    const o=m.get(key); const n=+a.n||1; o.n+=n; if(a.klasse&&a.klasse!=='unbestimmt') o.kl.set(a.klasse,(o.kl.get(a.klasse)||0)+n);
  }
  return [...m.values()].map(o=>({art:o.art,n:o.n,kl:[...o.kl].map(([k,v])=>k+' '+v)}));
}

/* ---------- Zeichnen ---------- */
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() }
function themeC(){ return {bg:tok('--panel-2'),line:tok('--line-strong'),muted:tok('--muted'),fg:tok('--fg'),signal:tok('--signal'),hit:tok('--hit'),fill:tok('--forest')} }
const PDFC={bg:'#ffffff',line:'#8f8f88',muted:'#55554f',fg:'#141414',signal:'#e06a00',hit:'#d0180a',fill:'#e6eee4'};
function fitCanvas(cv){ const r=cv.getBoundingClientRect(); const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr)); const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {w:r.width,h:r.height,ctx} }
function arrowHead(ctx,pts,size,color){
  if(pts.length<2) return; const e=pts[pts.length-1]; let i=pts.length-2;
  while(i>0&&Math.hypot(e[0]-pts[i][0],e[1]-pts[i][1])<size*1.2) i--;
  const a=Math.atan2(e[1]-pts[i][1],e[0]-pts[i][0]);
  ctx.save(); ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(e[0]+Math.cos(a)*size*.35,e[1]+Math.sin(a)*size*.35);
  ctx.lineTo(e[0]+Math.cos(a+2.6)*size,e[1]+Math.sin(a+2.6)*size); ctx.lineTo(e[0]+Math.cos(a-2.6)*size,e[1]+Math.sin(a-2.6)*size); ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawX(ctx,x,y,s,color,lw,halo){
  ctx.save(); ctx.lineCap='round';
  if(halo){ ctx.strokeStyle=halo; ctx.lineWidth=lw+4; ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke() }
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke(); ctx.restore();
}
function sketchGeom(w){ return {c:w/2,R:w*0.43} }
function drawSketch(ctx,w,data,C){
  const {c,R}=sketchGeom(w);
  ctx.clearRect(0,0,w,w); ctx.fillStyle=C.bg; ctx.fillRect(0,0,w,w);
  ctx.strokeStyle=C.line; ctx.lineWidth=Math.max(1.2,w*0.003);
  for(const f of [0.3,0.6,1]){ ctx.beginPath(); ctx.arc(c,c,R*f,0,Math.PI*2); ctx.stroke() }
  for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(c+Math.sin(a)*R*0.06,c-Math.cos(a)*R*0.06); ctx.lineTo(c+Math.sin(a)*R,c-Math.cos(a)*R); ctx.stroke() }
  const fs=Math.max(11,w*0.032);
  ctx.fillStyle=C.muted; ctx.font=`700 ${fs}px "JetBrains Mono",ui-monospace,monospace`; ctx.textBaseline='bottom'; ctx.textAlign='left';
  [[1,'100 m'],[0.6,'60 m'],[0.3,'30 m']].forEach(([f,t])=>ctx.fillText(t,c-R*f+4,c-4));
  ctx.fillStyle=C.fg; ctx.textAlign='center'; ctx.fillText('BLICK',c,c-R-6);
  ctx.beginPath(); ctx.moveTo(c,c-R*0.09); ctx.lineTo(c+R*0.06,c+R*0.05); ctx.lineTo(c-R*0.06,c+R*0.05); ctx.closePath(); ctx.fill();
  const P=v=>c+v/1000*R; const lw=Math.max(3.5,w*0.012);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const p of data.paths){
    if(p.length<2) continue; const pts=p.map(q=>[P(q[0]),P(q[1])]);
    ctx.strokeStyle=C.bg; ctx.lineWidth=lw+4; ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke();
    ctx.strokeStyle=C.signal; ctx.lineWidth=lw; ctx.stroke(); arrowHead(ctx,pts,w*0.04,C.signal);
  }
  for(const q of data.x) drawX(ctx,P(q[0]),P(q[1]),w*0.028,C.hit,Math.max(3.5,w*0.011),C.bg);
}
function silGeom(w,h){ const s=Math.min(w/200,h/120); return {s,ox:(w-200*s)/2,oy:(h-120*s)/2} }
function drawSil(ctx,w,h,kind,pose,hits,C){
  ctx.clearRect(0,0,w,h); ctx.fillStyle=C.bg; ctx.fillRect(0,0,w,h);
  const {s,ox,oy}=silGeom(w,h); const set=SIL[kind]||SIL.sau; const view=pose==='SV'?set.front:pose==='SH'?set.rear:set.side;
  ctx.save(); ctx.translate(ox,oy); ctx.scale(s,s);
  if(pose==='BL'||pose==='QH'){ ctx.translate(200,0); ctx.scale(-1,1) }
  if(pose==='QV'||pose==='QH'){ ctx.translate(100,0); ctx.scale(0.7,1); ctx.translate(-100,0) }
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=2.6;
  for(const part of view){ const p=new Path2D(part.d); if(part.f===2){ ctx.fillStyle=C.fg; ctx.fill(p); continue } if(part.f===1){ ctx.fillStyle=C.fill; ctx.fill(p) } ctx.strokeStyle=C.fg; ctx.stroke(p) }
  ctx.restore();
  if(pose==='QV'||pose==='QH'){ ctx.fillStyle=C.muted; ctx.font=`700 ${Math.max(11,12*s)}px "JetBrains Mono",ui-monospace,monospace`; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(pose==='QV'?'SCHRÄG VON VORN':'SCHRÄG WEG',ox+6,oy+4) }
  for(const q of hits||[]) drawX(ctx,ox+q[0]*s,oy+q[1]*s,8*s,C.hit,3.4*s,C.bg);
}
function drawStrokes(ctx,w,h,strokes){
  const lw=Math.max(3,Math.min(w,h)*0.011); ctx.lineCap='round'; ctx.lineJoin='round';
  for(const st of strokes||[]){
    const pts=[]; for(let i=0;i+1<st.p.length;i+=2) pts.push([st.p[i]/1000*w,st.p[i+1]/1000*h]); if(pts.length<2) continue;
    const col=PEN[st.c]||PEN.o;
    ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=lw+3; ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); arrowHead(ctx,pts,lw*3.6,col);
  }
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src }) }
async function composite(photo,strokes,maxW){
  const img=await loadImg(photo); const sc=Math.min(1,maxW/img.naturalWidth);
  const w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const ctx=cv.getContext('2d');
  ctx.drawImage(img,0,0,w,h); drawStrokes(ctx,w,h,strokes); return {url:cv.toDataURL('image/jpeg',0.82),w,h};
}
async function fileToPhoto(file){
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*sc); cv.height=Math.round(img.naturalHeight*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL('image/jpeg',0.76) }
  finally{ URL.revokeObjectURL(url) }
}
function bindPointer(cv,h){
  let active=false; const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top} };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(h.down(pt(e))){ active=true; try{ cv.setPointerCapture(e.pointerId) }catch(_){} } });
  cv.addEventListener('pointermove',e=>{ if(!active) return; e.preventDefault(); h.move(pt(e)) });
  const end=()=>{ if(!active) return; active=false; h.up() };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
}

const THUMBS=new Map();
async function loadThumbs(h){
  for(const e of h.entries){
    if(!e.hasPhoto) continue; const img=document.querySelector(`img[data-thumb="${e.id}"]`); if(!img) continue;
    const key=JSON.stringify(e.strokes||[]).length+':'+(h.updatedAt||0); let u=THUMBS.get(e.id);
    if(!u||u.key!==key){ const p=await KV.get('photo:'+e.id); if(!p){ img.remove(); continue } try{ const r=await composite(p,e.strokes,200); u={key,url:r.url}; THUMBS.set(e.id,u) }catch(_){ continue } }
    img.src=u.url;
  }
}

/* ---------- Uhr und Display ---------- */
function huntTimes(h){ const base=h.date||todayISO(); const mk=t=>{ if(!t) return null; const [y,m,d]=base.split('-').map(Number); const [a,b]=t.split(':').map(Number); return new Date(y,m-1,d,a,b,0) }; return {start:mk(h.start),end:mk(h.end)} }
function tick(){
  if(S.view!=='hunt') return; const h=cur(); if(!h) return;
  const now=new Date(), {start,end}=huntTimes(h);
  const clock=$('#clock'), sub=$('#clockSub'), fill=$('#pfill');
  if(clock&&end){
    const diff=end-now; clock.className='clock';
    if(diff<=0){ clock.textContent='Hahn in Ruh'; clock.classList.add('over'); if(sub) sub.textContent='Jagd beendet um '+h.end+' Uhr' }
    else{ clock.textContent=fmtDur(diff);
      if(start&&now<start){ clock.classList.add('pre'); if(sub) sub.textContent='Beginn '+h.start+' Uhr, noch '+fmtDur(start-now) }
      else if(diff<15*60000){ clock.classList.add('warn'); if(sub) sub.textContent='Letzte Viertelstunde' }
      else if(sub) sub.textContent=h.start?'Läuft seit '+h.start+' Uhr':'Zeit bis zum Ende' }
    if(fill){ const s0=start||new Date(end.getTime()-3*3600000); const f=Math.min(1,Math.max(0,(now-s0)/(end-s0))); fill.style.width=(f*100).toFixed(1)+'%' }
  } else if(sub) sub.textContent='';
  const ls=$('#lastShot');
  if(ls){ const t=(h.shotTimes||[]).slice(-1)[0]; if(t){ const m=Math.floor((now-t)/60000); ls.textContent='letzter '+hm(t)+(m<120?` · vor ${m} min`:'') } else ls.textContent='' }
}
const WL={lock:null,want:false};
async function reqWake(){
  try{ WL.lock=await navigator.wakeLock.request('screen'); WL.lock.addEventListener('release',()=>{ WL.lock=null }) }
  catch(e){ WL.lock=null; WL.want=false; toast('Das Display lässt sich hier nicht wach halten. Stelle unter Einstellungen › Anzeige › Automatische Sperre eine längere Zeit ein.') }
  const b=$('#wakeBtn'); if(b) b.textContent=WL.want?'Display bleibt an':'Display anlassen';
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&WL.want&&!WL.lock) reqWake() });

async function openEditor(id){

  else d=newEntry();
  d.sketch=d.sketch||{paths:[],x:[]}; d.strokes=d.strokes||[]; if(d.shot&&!d.s) d.s=newShot();
  S.draft=d; S.draftOrig=JSON.stringify(d); S.skTool='path';
  $('#edEye').textContent=id?'Eintrag bearbeiten':'Neue Sichtung'; $('#edTitle').textContent='Sichtung '+(d.time||'');
  $('#edSave').textContent=id?'Änderungen speichern':'Eintrag hinzufügen';

function renderEditor(){
  const sc=$('#edScroll'), top=sc.scrollTop; $('#edBody').innerHTML=edHTML(S.draft); sc.scrollTop=top;

function updatePhotoPreview(){ const d=S.draft, img=$('#edPhotoImg'); if(!img||!d.photo) return; composite(d.photo,d.strokes,1100).then(r=>{ if(img.isConnected) img.src=r.url }).catch(()=>{}) }
function mountSketch(){
  const cv=$('#skCv'); if(!cv) return; let g=fitCanvas(cv);
  const draw=()=>{ drawSketch(g.ctx,g.w,S.draft.sketch,themeC()); const r=$('#skRead'); if(r) r.textContent=sketchText(S.draft)||'' };
  draw(); cv._redraw=()=>{ g=fitCanvas(cv); draw() };
  let curP=null;
  const toN=p=>{ const {c,R}=sketchGeom(g.w); return [Math.round((p.x-c)/R*1000),Math.round((p.y-c)/R*1000)] };
  bindPointer(cv,{
    down(p){ const n=toN(p); const sk=S.draft.sketch;
      if(S.skTool==='x'){ const i=sk.x.findIndex(q=>Math.hypot(q[0]-n[0],q[1]-n[1])<90); if(i>=0) sk.x.splice(i,1); else sk.x.push(n); draw(); return false }
      curP=[n]; sk.paths.push(curP); return true },
    move(p){ const n=toN(p), l=curP[curP.length-1]; if(Math.hypot(n[0]-l[0],n[1]-l[1])<14) return; curP.push(n); draw() },
    up(){ if(curP&&curP.length<2) S.draft.sketch.paths.pop(); curP=null; draw() }
  });
}
function mountPose(){
  const cv=$('#poseCv'); if(!cv||!S.draft.s) return; let g=fitCanvas(cv);
  const draw=()=>drawSil(g.ctx,g.w,g.h,silKind(S.draft),S.draft.s.pose,S.draft.s.hits,themeC());
  draw(); cv._redraw=()=>{ g=fitCanvas(cv); draw() };
  bindPointer(cv,{ down(p){ const {s,ox,oy}=silGeom(g.w,g.h); const x=Math.round((p.x-ox)/s*10)/10, y=Math.round((p.y-oy)/s*10)/10;
      if(x<0||x>200||y<0||y>120) return false; const hits=S.draft.s.hits; const i=hits.findIndex(q=>Math.hypot(q[0]-x,q[1]-y)<11);
      if(i>=0) hits.splice(i,1); else hits.push([x,y]); draw(); return false }, move(){}, up(){} });
}

async function buildPDF(h,withPhotos){
  const J=window.jspdf&&window.jspdf.jsPDF; if(!J) throw {code:'nolib'};

  const wrap=(txt,w,size,b)=>{ doc.setFont('helvetica',b?'bold':'normal'); doc.setFontSize(size); return doc.splitTextToSize(String(txt),w) };
  const need=n=>{ if(y+n>PH-M-6){ doc.addPage(); y=M+4 } };
  const kv=(l,v)=>{ if(!v) return; const L=wrap(v,CW-40,10.5); need(L.length*4.8+2); T(l.toUpperCase(),M,y,{b:1,s:7.6,c:[105,105,98]}); T(L,M+40,y,{s:10.5}); y+=L.length*4.8+1.8 };
  const GREY=[95,95,90];
  doc.setFillColor(240,138,36); doc.rect(0,0,PW,5,'F'); doc.setFillColor(33,66,44); doc.rect(0,5,PW,1.6,'F');
  y=M+5; T('DRÜCKJAGD-BERICHT',M,y,{b:1,s:9,c:[214,100,0]}); y+=9;
  const tl=wrap(h.name||'Drückjagd',CW,22,true); T(tl,M,y,{b:1,s:22}); y+=tl.length*8.4;
  T([fmtDate(h.date),h.revier].filter(Boolean).join('  ·  ')||' ',M,y,{s:11,c:GREY}); y+=8;
  const facts=[['Stand',h.stand],['Treiben',h.treiben],['Schütze',h.schuetze],['Kaliber',h.kaliber],['Geschosstyp',h.geschoss],['Jagdzeit',(h.start||h.end)?[h.start,h.end].filter(Boolean).join(' – ')+' Uhr':'']];
  const colW=CW/3;
  facts.forEach((f,i)=>{ const cx=M+(i%3)*colW, cy=y+Math.floor(i/3)*13; doc.setDrawColor(190,190,184); doc.setLineWidth(0.3); doc.line(cx,cy,cx+colW-4,cy);
    T(f[0].toUpperCase(),cx,cy+4.2,{b:1,s:7.4,c:[105,105,98]}); T(wrap(f[1]||'–',colW-6,10.5,true)[0],cx,cy+9.4,{b:1,s:10.5}) });
  y+=29;
  const stats=[[h.shotsHeard||0,'Schüsse gehört'],[ownShots(h),'Eigene Schüsse'],[h.entries.length,'Sichtungen'],[h.entries.filter(e=>e.shot).length,'Davon mit Schuss']];
  const bw=(CW-9)/4;
  stats.forEach((s,i)=>{ const bx=M+i*(bw+3); doc.setFillColor(242,245,240); doc.rect(bx,y,bw,20,'F'); if(i<2) doc.setFillColor(240,138,36); else doc.setFillColor(33,66,44); doc.rect(bx,y,1.5,20,'F');
    T(String(s[0]),bx+5,y+11,{b:1,s:20}); T(s[1],bx+5,y+16.6,{s:8,c:GREY}) });
  y+=28;
  const agg=aggregate(h);
  if(agg.length){ T('GESEHENES WILD',M,y,{b:1,s:8.5,c:[214,100,0]}); y+=5.5;
    agg.forEach(a=>{ const L=wrap(`${a.art}: ${a.n}`+(a.kl.length?`  (${a.kl.join(', ')})`:''),CW,10.5); need(L.length*4.8); T(L,M,y,{s:10.5}); y+=L.length*4.8+0.6 }); y+=3 }
  if((h.shotTimes||[]).length){
    const b=new Map(); h.shotTimes.forEach(t=>{ const d=new Date(t); d.setMinutes(Math.floor(d.getMinutes()/15)*15,0,0); const k=hm(d.getTime()); b.set(k,(b.get(k)||0)+1) });
    const line=[...b].sort((a,c)=>a[0].localeCompare(c[0])).map(([k,v])=>`${k}: ${v}`).join('   ');
    T('SCHÜSSE GEHÖRT JE VIERTELSTUNDE',M,y,{b:1,s:8.5,c:[214,100,0]}); y+=5.5;
    const L=wrap(line,CW,10); need(L.length*4.6); T(L,M,y,{s:10}); y+=L.length*4.6;
    if(h.shotTimes.length!==(h.shotsHeard||0)){ T(`Zähler von Hand auf ${h.shotsHeard||0} gesetzt, ${h.shotTimes.length} Schüsse mit Uhrzeit erfasst.`,M,y+0.5,{s:8.5,c:GREY}); y+=4.6 }

      y=top+ih+7;
    }
    if(e.shot&&e.s){ const s=e.s;
      kv('Stellung',poseLabel(s.pose)+(s.gang?', '+s.gang:''));
      kv('Schüsse',`Gleiches Stück ${s.gleich||0}× beschossen`+(s.rotte?`, Rotte/Rudel ${s.rotte}× beschossen`:''));

        need(hh+9); doc.addImage(r.url,'JPEG',M,y-1,w,hh); y+=hh+3; T('Foto mit eingezeichnetem Weg',M,y,{s:8,c:GREY}); y+=5 } }

async function backupIn(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); if(!j||!Array.isArray(j.hunts)) throw 0; let n=0;
    for(const r of j.hunts){ if(!r||!r.id||!Array.isArray(r.entries)) continue; const i=S.hunts.findIndex(x=>x.id===r.id);
      if(i<0){ S.hunts.push(r); n++ } else if((r.updatedAt||0)>(S.hunts[i].updatedAt||0)){ S.hunts[i]=r; n++ } else continue; cloudDirty(r.id) }
    for(const [id,p] of Object.entries(j.photos||{})) if(typeof p==='string'&&p.startsWith('data:image/')) await KV.set('photo:'+id,p);
    S.deleted=S.deleted.filter(id=>!S.hunts.some(h=>h.id===id));
    await saveNow(); route(); toast(n?`${n} Drückjagd${n>1?'en':''} übernommen`:'Nichts Neues im Backup');
  }catch(e){ toast('Diese Datei ist kein Backup dieser App.') }
}

  if(t.dataset.armed){ fn(); return }
  const old=t.textContent; t.dataset.armed='1'; t.classList.add('armed'); t.textContent='Nochmal tippen zum Bestätigen';
  setTimeout(()=>{ if(t.isConnected&&t.dataset.armed){ delete t.dataset.armed; t.classList.remove('armed'); t.textContent=old } },4000);
}
function setSun(on){ S.sun=on; document.documentElement.classList.toggle('sun',on); const tm=document.querySelector('meta[name=theme-color]'); if(tm) tm.content=on?'#ffffff':'#0a0e0b'; saveSoon(); document.querySelectorAll('canvas').forEach(c=>c._redraw&&c._redraw()) }

/* ---------- Aktionen ---------- */
const ACT={
  newHunt:()=>openHuntSheet(null),
  open:t=>go('hunt',t.dataset.id),
  back:()=>{ S.huntId=null; go('list') },
  editHunt:()=>openHuntSheet(cur()),
  hsCancel:()=>closeSheet('hs'),
  hsSave:saveHunt,
  hsDel:t=>arm(t,deleteHunt),
  plus:t=>{ const h=cur(); h.shotsHeard=(+h.shotsHeard||0)+1; (h.shotTimes=h.shotTimes||[]).push(Date.now()); touch(h);
    const i=$('#countIn'); i.value=h.shotsHeard; i.classList.remove('bump'); void i.offsetWidth; i.classList.add('bump'); if(navigator.vibrate) navigator.vibrate(30); tick() },
  minus:()=>{ const h=cur(); if(!(h.shotsHeard>0)) return; h.shotsHeard--; if((h.shotTimes||[]).length>h.shotsHeard) h.shotTimes.pop(); touch(h); $('#countIn').value=h.shotsHeard; tick() },
  wake:()=>{ WL.want=!WL.want; if(WL.want) reqWake(); else { try{ WL.lock&&WL.lock.release() }catch(_){} WL.lock=null; $('#wakeBtn').textContent='Display anlassen' } },
  newEntry:()=>openEditor(null),
  editEntry:t=>openEditor(t.dataset.id),
  edCancel:t=>{ if(editorChanged()) arm(t,()=>{ closeSheet('ed'); S.draft=null }); else { closeSheet('ed'); S.draft=null } },
  edSave:saveEntry,
  edDel:t=>arm(t,deleteEntry),
  addAnimal:()=>{ const a=S.draft.animals; const p=a[a.length-1]; a.push({art:p?p.art:'Schwarzwild',klasse:'unbestimmt',n:1,kg:''}); renderEditor() },
  delAnimal:t=>{ S.draft.animals.splice(+t.dataset.i,1); renderEditor() },
  skUndo:()=>{ const sk=S.draft.sketch; if(S.skTool==='x'&&sk.x.length) sk.x.pop(); else if(sk.paths.length) sk.paths.pop(); else sk.x.pop(); renderEditor() },
  skClear:t=>arm(t,()=>{ S.draft.sketch={paths:[],x:[]}; renderEditor() }),
  drawEdit:()=>openDraw(),
  photoDel:t=>arm(t,()=>{ S.draft.photo=null; S.draft.strokes=[]; S.draft._photoChanged=true; renderEditor() }),
  drawDone:()=>closeDraw(),
  drawUndo:()=>{ S.draft.strokes.pop(); redrawDraw() },
  drawClear:t=>arm(t,()=>{ S.draft.strokes=[]; redrawDraw() }),
  report:openReport,
  repClose:()=>closeSheet('rep'),
  repShare:shareReport,
  repMake:makeReport,
  backupOut:backupOut
};
document.addEventListener('click',e=>{
  const pen=e.target.closest('[data-pen]');
  if(pen){ DR.pen=pen.dataset.pen; document.querySelectorAll('[data-pen]').forEach(b=>b.setAttribute('aria-pressed',b===pen)); return }
  const ch=e.target.closest('[data-chip]');
  if(ch){ onChip(ch); return }
  const st=e.target.closest('[data-step]');
  if(st){ const path=st.dataset.step, min=+st.dataset.min||0; setP(S.draft,path,Math.max(min,(+getP(S.draft,path)||0)+(+st.dataset.d))); renderEditor(); return }
  const t=e.target.closest('[data-act]'); if(t&&ACT[t.dataset.act]) ACT[t.dataset.act](t,e);
});
function onChip(t){
  const k=t.dataset.chip, v=t.dataset.v, d=S.draft;
  if(k==='tool'){ S.skTool=v; t.parentNode.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b===t)); return }
  if(!d) return;
  if(k==='shot'){ d.shot=v==='ja'; if(d.shot&&!d.s) d.s=newShot(); renderEditor(); return }
  if(t.dataset.multi){ const arr=(getP(d,k)||[]).slice(); const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); setP(d,k,arr) }
  else { setP(d,k,getP(d,k)===v?'':v); if(k==='s.pose'){ if(!d.s.pose) d.s.pose=v; d.s.hits=[] } }
  renderEditor();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k&&S.draft&&t.closest('#ed')){ setP(S.draft,t.dataset.k,t.value); if(t.dataset.k==='time') $('#edTitle').textContent='Sichtung '+t.value }
  else if(t.dataset.hk&&S.hdraft){ S.hdraft[t.dataset.hk]=t.value }
});
document.addEventListener('change',e=>{
  const t=e.target, h=cur();
  if(t.id==='countIn'&&h){ h.shotsHeard=Math.max(0,parseInt(t.value,10)||0); t.value=h.shotsHeard; touch(h); return }
  if(t.id==='endQuick'&&h&&t.value){ h.end=t.value; touch(h); renderHunt(); return }
  if(t.id==='camIn'||t.id==='libIn'){ onPhotoFile(t); return }
  if(t.id==='backupIn'){ backupIn(t); return }
  if(t.id==='sunSw'){ setSun(t.checked); return }
  if(t.tagName==='SELECT'&&t.dataset.k&&S.draft){ setP(S.draft,t.dataset.k,t.value);
    if(t.dataset.art!=null){ const a=S.draft.animals[+t.dataset.art]; const w=WILD[a.art]; a.klasse=w.kl[0]||''; if(!w.kg) a.kg=''; if(!w.free) delete a.name }
    renderEditor() }
});
let rzT; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ layoutDraw(); document.querySelectorAll('#ed canvas').forEach(c=>c._redraw&&c._redraw()) },150) });

/* ---------- Start ---------- */
(async function boot(){
  await KV.open();
  const st=await KV.get('state');
  if(st&&Array.isArray(st.hunts)){ S.hunts=st.hunts; S.sun=!!st.sun; S.deleted=st.deleted||[]; S.seeded=!!st.seeded; S.view=st.view||'list'; S.huntId=st.huntId||null }
  if(!S.seeded&&!S.hunts.length){ S.hunts.push(exampleHunt()); S.seeded=true; saveNow() }
  document.documentElement.classList.toggle('sun',S.sun); if(S.sun){ const tm=document.querySelector('meta[name=theme-color]'); if(tm) tm.content='#ffffff' }
  route(); setInterval(tick,1000);
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
  if('serviceWorker' in navigator&&location.protocol!=='file:'){ navigator.serviceWorker.register('./sw.js').catch(()=>{}) }
})();
</script>
</body>
